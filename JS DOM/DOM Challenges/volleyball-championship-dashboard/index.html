<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volleyball Championship Dashboard</title>
  </head>
  <body>
    <h1 id="dashboard-title">Volleyball League</h1>

    <p id="ready-count">Ready matches: 0</p>
    <p id="live-count">Live matches: 0</p>

    <section id="matches">
      <div class="match">
        <h3 class="match-title">Match 1</h3>
        <p class="status">Waiting</p>
      </div>

      <div class="match">
        <h3 class="match-title">Match 2</h3>
        <p class="status">Live</p>
      </div>

      <div class="match">
        <h3 class="match-title">Match 3</h3>
        <p class="status">Completed</p>
      </div>

      <div class="match">
        <h3 class="match-title">Match 4</h3>
        <p class="status">Waiting</p>
      </div>

      <div class="match">
        <h3 class="match-title">Match 5</h3>
        <p class="status">Live</p>
      </div>
    </section>

    <p class="status">Registration open</p>

    <script src="script.js"></script>
  </body>
</html>
