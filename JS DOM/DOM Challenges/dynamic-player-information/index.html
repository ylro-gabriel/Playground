<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Player Information</title>
  </head>
  <body>
    <h1>Player Information System</h1>

    <div class="player-card">
      <h2>Player Details</h2>

      <p>Name: <span id="player-name"></span></p>
      <p>Position: <span id="player-position"></span></p>
      <p>Jersey: <span id="player-jersey"></span></p>
      <p>Team: <span id="player-team"></span></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
