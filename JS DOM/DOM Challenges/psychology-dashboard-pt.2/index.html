<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Psychology Research Dashboard</title>
  </head>
  <body>
    <h1>Student Stress Research</h1>

    <section class="group" id="group-a">
      <h2>Group A</h2>

      <p class="student">Ana - <span class="stress">High</span></p>
      <p class="student">Ben - <span class="stress">Low</span></p>
      <p class="student">Carlo - <span class="stress">High</span></p>

      <h3 class="high-count">High Stress: 0</h3>
      <p class="group-status">Checking...</p>
    </section>
    <section class="group" id="group-b">
      <h2>Group B</h2>

      <p class="student">Diana - <span class="stress">Moderate</span></p>
      <p class="student">Ella - <span class="stress">High</span></p>
      <p class="student">Felix - <span class="stress">Low</span></p>

      <h3 class="high-count">High Stress: 0</h3>
      <p class="group-status">Checking...</p>
    </section>

    <h2 id="total-high">Total High Stress: 0</h2>

    <script src="script.js"></script>
  </body>
</html>
