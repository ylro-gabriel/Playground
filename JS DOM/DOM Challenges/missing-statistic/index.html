<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Data Checker</title>
  </head>
  <body>
    <h2>Player Data Checker</h2>

    <p>
      Does the player have a height record?
      <span id="height-status">Checking...</span>
    </p>

    <p>
      Does the player have a position record?
      <span id="position-status">Checking...</span>
    </p>

    <h2>Player Report</h2>
    <div class="player-report">
      <p>
        Position:
        <span id="report-position">Waiting...</span>
      </p>

      <p>
        Height:
        <span id="report-height">Waiting...</span>
      </p>

      <p>
        Jersey Number:
        <span id="report-jersey">Waiting...</span>
      </p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
