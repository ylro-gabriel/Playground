<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match Status Manager</title>
  </head>
  <body>
    <h2>Volleyball Tournament</h2>

    <section id="matches">
      <div class="match">
        <h3>Match 1</h3>
        <p class="status">Waiting</p>
      </div>

      <div class="match">
        <h3>Match 2</h3>
        <p class="status">Live</p>
      </div>

      <div class="match">
        <h3>Match 3</h3>
        <p class="status">Waiting</p>
      </div>
    </section>

    <p class="status">Tournament registration</p>

    <script src="script.js"></script>
  </body>
</html>
